version: '3.8'

services:
  # =========================================================================
  # 1. DISTRIBUTED CACHE LAYER (REDIS) - Consumes NO host/network env vars
  # =========================================================================
  redis_cache:
    image: redis:7-alpine
    container_name: whisper_redis
    expose:
      - "6379"
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    networks:
      - whisper_mesh
    restart: always

  # =========================================================================
  # 2. LOCAL LLM INFERENCE SERVER LAYER (OLLAMA / LLAMA)
  # =========================================================================
  llama_inference_server:
    image: ollama/ollama:latest
    container_name: local_llama_server
    expose:
      - "11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - whisper_mesh
    restart: always

  # =========================================================================
  # 3. HIGH-CONCURRENCY WHISPER BACKEND APP LAYER (FASTAPI)
  # =========================================================================
  whisper_backend:
    build:
      context: .
      dockerfile: ./app/Dockerfile 
    container_name: whisper_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # ONLY the app container receives the network bridge routing parameters
      - REDIS_HOST=redis_cache
      - SUMMARIZER_LOCAL_API_ENDPOINT=http://llama_inference_server:11434/v1
      # Overrides mapping cleanly to Hydra parameter configurations
      - WS_ENFORCE_TOKEN_AUTH=false
      - WHISPER_DEVICE=cpu
      - WS_MAX_CHUNK_SIZE_BYTES=524288
      - JWT_JWKS_URL=https://your-idp-domain.com
      - JWT_AUDIENCE=https://enterprise.com
      - JWT_ISSUER=https://your-idp-domain.com
      - LLM_TEMPERATURE=0.3
      - LLM_MAX_RETRIES=3
      - LLM_INITIAL_BACKOFF=1.0
      - LLM_TIMEOUT_SECONDS=30.0
    depends_on:
      - redis_cache
      - llama_inference_server
    networks:
      - whisper_mesh
    restart: always

networks:
  whisper_mesh:
    driver: bridge

volumes:
  ollama_storage: